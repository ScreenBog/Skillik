<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243752">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app_name|default('Skillik') }}{% endblock %}</title>
  <script>
    (function () {
      try {
        var p = localStorage.getItem("skillik-theme") || "system";
        var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {# Lora + Source Sans 3 — академично, не «Inter SaaS» #}
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=2">
  {% block head %}{% endblock %}
</head>
<body
  data-theme-pref="{{ user.theme_preference if user is defined and user else 'system' }}"
  {% if user is defined and user and user.accent_color %}data-accent="{{ user.accent_color }}"{% endif %}
>
  {% block body %}{% endblock %}
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
