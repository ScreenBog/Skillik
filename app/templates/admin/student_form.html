{% extends "admin/base_admin.html" %}
{% block title %}Новый ученик — Skillik{% endblock %}
{% block topbar_title %}Новый ученик{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Создать ученика</h1>
    <p class="desc">Логин и пароль выдаются ученику</p>
  </div>
</div>

{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<div class="card" style="max-width:520px">
  <form method="post" action="/admin/students/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label>ФИО</label>
      <input class="form-control" name="full_name" required>
    </div>
    <div class="form-group">
      <label>Логин</label>
      <input class="form-control" name="username" required pattern="[a-zA-Z0-9_]+" title="Латиница, цифры, _">
    </div>
    <div class="form-group">
      <label>Пароль (пусто = сгенерировать)</label>
      <input class="form-control" name="password" type="text" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Email (необязательно)</label>
      <input class="form-control" name="email" type="email">
    </div>
    <button type="submit" class="btn btn-primary">Создать</button>
    <a href="/admin/students" class="btn btn-ghost">Отмена</a>
  </form>
</div>
{% endblock %}
